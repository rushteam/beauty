<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0b0e14; color: #cbd5e1;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 8px 12px; background: #111827; border-bottom: 1px solid #1f2937;
    display: flex; align-items: center; gap: 12px; }
  header .title { font-weight: 600; color: #e5e7eb; }
  header .status { margin-left: auto; font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; margin-right: 6px; vertical-align: middle; }
  .dot.on { background: #22c55e; }
  #out { flex: 1; overflow-y: auto; padding: 10px 12px; white-space: pre-wrap;
    word-break: break-word; }
  .line { margin: 0 0 2px; }
  .line.cmd { color: #7dd3fc; }
  .line.err { color: #f87171; }
  .line.push { color: #a78bfa; }
  .line.sys { color: #94a3b8; }
  .inputbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-top: 1px solid #1f2937; background: #0f1420; }
  .inputbar .prompt { color: #22c55e; }
  #cmd { flex: 1; background: transparent; border: none; outline: none;
    color: #e5e7eb; font: inherit; }
  #hints { padding: 0 12px; max-height: 140px; overflow-y: auto; }
  .hint { padding: 3px 6px; cursor: pointer; border-radius: 4px; display: flex; gap: 10px; }
  .hint:hover, .hint.sel { background: #1f2937; }
  .hint .n { color: #7dd3fc; min-width: 110px; }
  .hint .note { color: #94a3b8; }
  .login { display: flex; gap: 8px; align-items: center; padding: 8px 12px;
    background: #111827; border-top: 1px solid #1f2937; }
  .login input { background: #0b0e14; border: 1px solid #1f2937; color: #e5e7eb;
    padding: 4px 8px; border-radius: 4px; font: inherit; }
  .login button, .inputbar button { background: #2563eb; color: #fff; border: none;
    padding: 5px 12px; border-radius: 4px; cursor: pointer; font: inherit; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <span class="title">{{.Title}}</span>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">未连接</span></span>
  </header>

  <div id="out"></div>
  <div id="hints"></div>

  <div class="inputbar">
    <span class="prompt">&gt;</span>
    <input id="cmd" autocomplete="off" spellcheck="false"
      placeholder="输入命令,Tab 补全,↑/↓ 历史,!n 重放,回车执行" autofocus>
    <button id="send">发送</button>
  </div>

  <div class="login hidden" id="loginBar">
    <span>登录:</span>
    <input id="user" placeholder="用户名" autocomplete="username">
    <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
    <button id="loginBtn">登录</button>
  </div>

<script>
(function () {
  const WSURL = "{{.WSURL}}";
  const out = document.getElementById("out");
  const cmd = document.getElementById("cmd");
  const hints = document.getElementById("hints");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const loginBar = document.getElementById("loginBar");

  let ws = null;
  let seq = 1;
  const history = [];      // 已执行命令
  let histIdx = -1;        // 上下键浏览位置
  let hintList = [];       // 当前补全项
  let hintSel = -1;        // 当前选中补全项

  function append(text, cls) {
    const p = document.createElement("div");
    p.className = "line" + (cls ? " " + cls : "");
    p.textContent = text;
    out.appendChild(p);
    out.scrollTop = out.scrollHeight;
  }

  function setStatus(on, text) {
    dot.classList.toggle("on", on);
    statusText.textContent = text;
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(proto + "://" + location.host + WSURL);
    ws.onopen = () => setStatus(true, "已连接");
    ws.onclose = () => { setStatus(false, "已断开,3 秒后重连…"); setTimeout(connect, 3000); };
    ws.onerror = () => setStatus(false, "连接错误");
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      onMessage(msg);
    };
  }

  function onMessage(msg) {
    switch (msg.type) {
      case "welcome":
        append(String(msg.data || ""), "sys");
        break;
      case "hint":
        renderHints(Array.isArray(msg.data) ? msg.data : []);
        break;
      case "login":
        append(msg.ok ? ("[login] " + msg.data) : ("[login] " + (msg.error || "失败")),
               msg.ok ? "sys" : "err");
        if (msg.ok) loginBar.classList.add("hidden");
        break;
      case "push":
        append("[" + msg.push + "] " + String(msg.data || ""), "push");
        break;
      default: // text / 命令结果
        if (msg.ok) {
          if (msg.data !== undefined && msg.data !== null && String(msg.data) !== "")
            append(String(msg.data));
        } else {
          append(msg.error || "执行失败", "err");
          if ((msg.error || "").indexOf("需要登录") >= 0) loginBar.classList.remove("hidden");
        }
    }
  }

  function send(obj) {
    if (!ws || ws.readyState !== 1) { append("未连接,无法发送", "err"); return; }
    obj.id = seq++;
    ws.send(JSON.stringify(obj));
  }

  function runCommand(line) {
    line = line.trim();
    if (!line) return;
    // !n 重放历史
    if (line[0] === "!") {
      const n = parseInt(line.slice(1), 10);
      if (!isNaN(n) && n >= 0 && n < history.length) {
        line = history[n];
        append("!" + n + " -> " + line, "sys");
      } else {
        append("无效历史序号: " + line, "err");
        return;
      }
    }
    append("> " + line, "cmd");
    history.push(line);
    histIdx = history.length;
    clearHints();
    send({ action: "command", command: line });
  }

  function renderHints(list) {
    hintList = list;
    hintSel = -1;
    hints.innerHTML = "";
    for (const h of list) {
      const d = document.createElement("div");
      d.className = "hint";
      d.innerHTML = '<span class="n"></span><span class="note"></span>';
      d.querySelector(".n").textContent = h.example || h.name;
      d.querySelector(".note").textContent = h.note || "";
      d.onclick = () => { applyHint(h); };
      hints.appendChild(d);
    }
  }
  function clearHints() { hintList = []; hintSel = -1; hints.innerHTML = ""; }
  function applyHint(h) { cmd.value = h.name + " "; clearHints(); cmd.focus(); }

  cmd.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      if (hintSel >= 0 && hintSel < hintList.length) { applyHint(hintList[hintSel]); return; }
      runCommand(cmd.value); cmd.value = "";
    } else if (e.key === "Tab") {
      e.preventDefault();
      if (hintList.length === 1) { applyHint(hintList[0]); }
      else if (hintList.length > 1) { hintSel = (hintSel + 1) % hintList.length; markSel(); }
      else { send({ action: "hint", head: cmd.value.trim() }); }
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (hintList.length) { hintSel = (hintSel - 1 + hintList.length) % hintList.length; markSel(); }
      else if (histIdx > 0) { histIdx--; cmd.value = history[histIdx] || ""; }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (hintList.length) { hintSel = (hintSel + 1) % hintList.length; markSel(); }
      else if (histIdx < history.length - 1) { histIdx++; cmd.value = history[histIdx] || ""; }
      else { histIdx = history.length; cmd.value = ""; }
    } else if (e.key === "Escape") {
      clearHints();
    }
  });

  cmd.addEventListener("input", () => {
    const head = cmd.value.trim();
    if (head && head.indexOf(" ") < 0) send({ action: "hint", head: head });
    else clearHints();
  });

  function markSel() {
    const nodes = hints.querySelectorAll(".hint");
    nodes.forEach((n, i) => n.classList.toggle("sel", i === hintSel));
  }

  document.getElementById("send").onclick = () => { runCommand(cmd.value); cmd.value = ""; cmd.focus(); };
  document.getElementById("loginBtn").onclick = () => {
    send({ action: "login",
      user: document.getElementById("user").value,
      password: document.getElementById("pass").value });
  };

  connect();
})();
</script>
</body>
</html>
